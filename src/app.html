<title>Pixie Closet</title>
<meta name="description" content="A browser dress-up character creator with pixel-art outfits, hair, hats and gear.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a game client — stage window on the left, inventory window on the right, stacked on phones. */
:root {
  --sky: #cfe9f6;        /* page ground */
  --sky-2: #f6eedf;
  --wood: #6b4430;       /* window frames */
  --wood-2: #8f5d3f;
  --parch: #fbf3e2;      /* window bodies */
  --parch-2: #f1e3c6;
  --ink: #3a2418;        /* text */
  --ink-soft: #7b5b48;
  --accent: #f08a3c;     /* maple orange */
  --accent-ink: #ffffff;
  --sel: #3f6fd8;        /* selection blue */
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--body); color: var(--ink);
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%);
  padding-inline: 16px; padding-block: 16px 32px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); letter-spacing: .5px; color: var(--wood); line-height: 1;
  text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 3px 3px 0 var(--accent); }
.tag { font-family: var(--display); font-size: 15px; color: var(--ink-soft); }
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.win { background: var(--parch); border: 3px solid var(--wood); border-radius: 10px; box-shadow: 0 4px 0 var(--wood-2), 0 10px 24px rgba(80, 50, 30, .18); min-width: 0; }
.win > .title { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: linear-gradient(180deg, var(--wood-2), var(--wood)); color: #fff4df;
  font-family: var(--display); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 6px 6px 0 0; }
.win > .title small { font-family: var(--body); letter-spacing: 0; text-transform: none; font-size: 12px; opacity: .85; }
.pad { padding: 12px; display: grid; gap: 12px; }

/* stage */
.stage { position: relative; border: 3px solid var(--wood); border-radius: 6px; overflow: hidden; background: #9fd7f5; }
.stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 256 / 208; }
.mapname { position: absolute; left: 8px; top: 8px; background: rgba(30, 20, 40, .62); color: #fff; font-family: var(--display); font-size: 13px; padding: 3px 8px; border-radius: 4px; }
.nametag { position: absolute; left: 50%; transform: translateX(-50%); top: calc(188 / 208 * 100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.nametag .nm { background: rgba(20, 16, 30, .78); color: #fff; font-family: var(--display); font-size: clamp(11px, 1.6vw, 14px); padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.nametag .job { font-family: var(--display); font-size: clamp(9px, 1.3vw, 12px); color: #fff; text-shadow: 1px 1px 0 #000; }
.bubble { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 60%; background: #fff; border: 2px solid #3a2418; border-radius: 8px; padding: 4px 10px;
  font-family: var(--body); font-weight: 700; font-size: clamp(11px, 1.6vw, 14px); text-align: center; overflow-wrap: anywhere; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #3a2418; border-bottom: 0; }
.turn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--wood); background: rgba(251, 243, 226, .92);
  font-family: var(--display); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.turn:hover { background: #fff; }
.turn.l { left: 8px; } .turn.r { right: 8px; }
.viewlbl { position: absolute; right: 8px; top: 8px; background: rgba(251, 243, 226, .92); border: 2px solid var(--wood); border-radius: 4px; font-family: var(--display); font-size: 12px; padding: 1px 6px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 2px solid var(--wood); background: linear-gradient(180deg, #fff9ee, var(--parch-2)); border-radius: 6px; padding: 6px 12px; font-weight: 800; font-size: 14px;
  box-shadow: 0 2px 0 var(--wood-2); transition: transform .06s; }
.btn:hover { background: #fff; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.go { background: linear-gradient(180deg, #ffb46e, var(--accent)); color: var(--accent-ink); text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.field { display: flex; gap: 6px; align-items: center; flex: 1 1 200px; min-width: 0; }
.field label { font-family: var(--display); font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.field input[type=text] { flex: 1; min-width: 0; border: 2px solid var(--wood-2); border-radius: 6px; padding: 6px 8px; background: #fff; }
select { font: inherit; border: 2px solid var(--wood-2); border-radius: 6px; padding: 5px 6px; background: #fff; }
.section-lbl { font-family: var(--display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
.jobs { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--wood-2); border-radius: 999px; padding: 3px 10px; background: #fff; font-weight: 800; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 2px dashed var(--wood-2); border-radius: 8px; padding: 6px; display: grid; gap: 6px; justify-items: center; background: #fffaf0; }
.slot canvas { width: 48px; height: 66px; image-rendering: pixelated; }
.slot .row { justify-content: center; gap: 4px; }
.slot .btn { padding: 2px 8px; font-size: 12px; }

/* inventory */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 2px solid var(--wood-2); border-bottom-width: 3px; background: var(--parch-2); border-radius: 6px; padding: 4px 9px; font-family: var(--display); font-size: 14px; color: var(--ink); }
.tab[aria-selected="true"] { background: var(--sel); border-color: #26489a; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; padding: 4px; background: var(--parch-2); border: 2px solid var(--wood-2); border-radius: 8px; }
.cell { position: relative; aspect-ratio: 1; border: 2px solid #c9a985; border-radius: 6px; background: radial-gradient(circle at 50% 40%, #fffdf6, #f3e6cb); padding: 2px; display: grid; place-items: center; }
.cell:hover { border-color: var(--accent); }
.cell[aria-pressed="true"] { border-color: var(--sel); box-shadow: inset 0 0 0 2px var(--sel); background: radial-gradient(circle at 50% 40%, #ffffff, #dbe6fb); }
.cell canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.cell .x { font-family: var(--display); font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.1; }
.itemname { font-family: var(--display); font-size: 16px; min-height: 22px; }
.itemname span { font-family: var(--body); font-size: 13px; color: var(--ink-soft); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 6px; border: 2px solid rgba(58, 36, 24, .45); padding: 0; }
.sw[aria-pressed="true"] { outline: 3px solid var(--sel); outline-offset: 1px; }
.sw.big { width: auto; height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #fff; }
.sw.big i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .3); display: inline-block; }
input[type=color] { width: 34px; height: 28px; border: 2px solid var(--wood-2); border-radius: 6px; padding: 0; background: #fff; }
.hint { font-size: 12px; color: var(--ink-soft); }

dialog { border: 3px solid var(--wood); border-radius: 10px; background: var(--parch); color: var(--ink); padding: 0; max-width: min(92vw, 640px); }
dialog::backdrop { background: rgba(30, 20, 40, .55); }
dialog img { display: block; width: 100%; image-rendering: pixelated; border-radius: 6px; border: 2px solid var(--wood-2); }
dialog textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 2px solid var(--wood-2); border-radius: 6px; padding: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2a1c14; color: #fff4df; padding: 8px 14px; border-radius: 8px; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="logo">Pixie Closet</div>
    <div class="tag">character creator · pick a look, then hit the map</div>
  </header>

  <div class="main">
    <section class="win" aria-label="Character stage">
      <div class="title">Character <small id="statline">Lv. 1 · Beginner</small></div>
      <div class="pad">
        <div class="stage" id="stage">
          <canvas id="view" width="256" height="208"></canvas>
          <div class="mapname" id="mapname">Mushroom Meadow</div>
          <div class="viewlbl" id="viewlbl">Front</div>
          <div class="bubble" id="bubble" hidden></div>
          <div class="nametag"><div class="nm" id="nm">Pixie</div></div>
          <button class="turn l" id="turnL" aria-label="Turn left">◀</button>
          <button class="turn r" id="turnR" aria-label="Turn right">▶</button>
        </div>
        <div class="row">
          <div class="field"><label for="name">Name</label><input id="name" type="text" maxlength="14" value="Pixie"></div>
          <div class="field"><label for="map">Map</label><select id="map"></select></div>
        </div>
        <form class="row" id="chatform">
          <div class="field"><label for="chat">Say</label><input id="chat" type="text" maxlength="60" placeholder="Type, then Enter to show a chat bubble"></div>
          <button class="btn" type="submit">Say</button>
        </form>
        <div class="row">
          <button class="btn go" id="rand">🎲 Randomize</button>
          <button class="btn" id="undress">Undress</button>
          <button class="btn" id="snap">Snapshot</button>
          <button class="btn" id="share">Outfit code</button>
        </div>
        <div class="section-lbl">Job outfits</div>
        <div class="jobs" id="jobs"></div>
        <div class="section-lbl">Closet slots</div>
        <div class="slots" id="slots"></div>
      </div>
    </section>

    <section class="win" aria-label="Inventory">
      <div class="title">Inventory <small id="count"></small></div>
      <div class="pad">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="itemname" id="itemname">&nbsp;</div>
        <div class="grid" id="grid"></div>
        <div class="section-lbl" id="dyelbl">Dye</div>
        <div class="swatches" id="swatches"></div>
        <div class="hint">Tip: drag on the stage or use ◀ ▶ to turn. Keys: ← → turn, R randomize.</div>
      </div>
    </section>
  </div>
</div>

<dialog id="dlg">
  <div class="title" style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,var(--wood-2),var(--wood));color:#fff4df;font-family:var(--display);padding:6px 12px;letter-spacing:1.5px;text-transform:uppercase"><span id="dlgtitle">Snapshot</span><button class="btn" id="dlgclose" style="padding:0 8px">✕</button></div>
  <div class="pad" id="dlgbody"></div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script>/*__SCRIPTS__*/</script>
