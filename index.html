<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixie Closet</title>
<meta name="description" content="A browser dress-up character creator with pixel-art outfits, hair, hats and gear.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a game client — stage window on the left, inventory window on the right, stacked on phones. */
:root {
  --sky: #cfe9f6;        /* page ground */
  --sky-2: #f6eedf;
  --wood: #6b4430;       /* window frames */
  --wood-2: #8f5d3f;
  --parch: #fbf3e2;      /* window bodies */
  --parch-2: #f1e3c6;
  --ink: #3a2418;        /* text */
  --ink-soft: #7b5b48;
  --accent: #f08a3c;     /* maple orange */
  --accent-ink: #ffffff;
  --sel: #3f6fd8;        /* selection blue */
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--body); color: var(--ink);
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%);
  padding-inline: 16px; padding-block: 16px 32px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); letter-spacing: .5px; color: var(--wood); line-height: 1;
  text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 3px 3px 0 var(--accent); }
.tag { font-family: var(--display); font-size: 15px; color: var(--ink-soft); }
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.win { background: var(--parch); border: 3px solid var(--wood); border-radius: 10px; box-shadow: 0 4px 0 var(--wood-2), 0 10px 24px rgba(80, 50, 30, .18); min-width: 0; }
.win > .title { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: linear-gradient(180deg, var(--wood-2), var(--wood)); color: #fff4df;
  font-family: var(--display); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 6px 6px 0 0; }
.win > .title small { font-family: var(--body); letter-spacing: 0; text-transform: none; font-size: 12px; opacity: .85; }
.pad { padding: 12px; display: grid; gap: 12px; }

/* stage */
.stage { position: relative; border: 3px solid var(--wood); border-radius: 6px; overflow: hidden; background: #9fd7f5; }
.stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 256 / 208; }
.mapname { position: absolute; left: 8px; top: 8px; background: rgba(30, 20, 40, .62); color: #fff; font-family: var(--display); font-size: 13px; padding: 3px 8px; border-radius: 4px; }
.nametag { position: absolute; left: 50%; transform: translateX(-50%); top: calc(188 / 208 * 100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.nametag .nm { background: rgba(20, 16, 30, .78); color: #fff; font-family: var(--display); font-size: clamp(11px, 1.6vw, 14px); padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.nametag .job { font-family: var(--display); font-size: clamp(9px, 1.3vw, 12px); color: #fff; text-shadow: 1px 1px 0 #000; }
.bubble { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 60%; background: #fff; border: 2px solid #3a2418; border-radius: 8px; padding: 4px 10px;
  font-family: var(--body); font-weight: 700; font-size: clamp(11px, 1.6vw, 14px); text-align: center; overflow-wrap: anywhere; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #3a2418; border-bottom: 0; }
.turn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--wood); background: rgba(251, 243, 226, .92);
  font-family: var(--display); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.turn:hover { background: #fff; }
.turn.l { left: 8px; } .turn.r { right: 8px; }
.viewlbl { position: absolute; right: 8px; top: 8px; background: rgba(251, 243, 226, .92); border: 2px solid var(--wood); border-radius: 4px; font-family: var(--display); font-size: 12px; padding: 1px 6px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 2px solid var(--wood); background: linear-gradient(180deg, #fff9ee, var(--parch-2)); border-radius: 6px; padding: 6px 12px; font-weight: 800; font-size: 14px;
  box-shadow: 0 2px 0 var(--wood-2); transition: transform .06s; }
.btn:hover { background: #fff; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.go { background: linear-gradient(180deg, #ffb46e, var(--accent)); color: var(--accent-ink); text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.field { display: flex; gap: 6px; align-items: center; flex: 1 1 200px; min-width: 0; }
.field label { font-family: var(--display); font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.field input[type=text] { flex: 1; min-width: 0; border: 2px solid var(--wood-2); border-radius: 6px; padding: 6px 8px; background: #fff; }
select { font: inherit; border: 2px solid var(--wood-2); border-radius: 6px; padding: 5px 6px; background: #fff; }
.section-lbl { font-family: var(--display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
.jobs { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--wood-2); border-radius: 999px; padding: 3px 10px; background: #fff; font-weight: 800; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 2px dashed var(--wood-2); border-radius: 8px; padding: 6px; display: grid; gap: 6px; justify-items: center; background: #fffaf0; }
.slot canvas { width: 48px; height: 66px; image-rendering: pixelated; }
.slot .row { justify-content: center; gap: 4px; }
.slot .btn { padding: 2px 8px; font-size: 12px; }

/* inventory */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 2px solid var(--wood-2); border-bottom-width: 3px; background: var(--parch-2); border-radius: 6px; padding: 4px 9px; font-family: var(--display); font-size: 14px; color: var(--ink); }
.tab[aria-selected="true"] { background: var(--sel); border-color: #26489a; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; padding: 4px; background: var(--parch-2); border: 2px solid var(--wood-2); border-radius: 8px; }
.cell { position: relative; aspect-ratio: 1; border: 2px solid #c9a985; border-radius: 6px; background: radial-gradient(circle at 50% 40%, #fffdf6, #f3e6cb); padding: 2px; display: grid; place-items: center; }
.cell:hover { border-color: var(--accent); }
.cell[aria-pressed="true"] { border-color: var(--sel); box-shadow: inset 0 0 0 2px var(--sel); background: radial-gradient(circle at 50% 40%, #ffffff, #dbe6fb); }
.cell canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.cell .x { font-family: var(--display); font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.1; }
.itemname { font-family: var(--display); font-size: 16px; min-height: 22px; }
.itemname span { font-family: var(--body); font-size: 13px; color: var(--ink-soft); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 6px; border: 2px solid rgba(58, 36, 24, .45); padding: 0; }
.sw[aria-pressed="true"] { outline: 3px solid var(--sel); outline-offset: 1px; }
.sw.big { width: auto; height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #fff; }
.sw.big i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .3); display: inline-block; }
input[type=color] { width: 34px; height: 28px; border: 2px solid var(--wood-2); border-radius: 6px; padding: 0; background: #fff; }
.hint { font-size: 12px; color: var(--ink-soft); }

dialog { border: 3px solid var(--wood); border-radius: 10px; background: var(--parch); color: var(--ink); padding: 0; max-width: min(92vw, 640px); }
dialog::backdrop { background: rgba(30, 20, 40, .55); }
dialog img { display: block; width: 100%; image-rendering: pixelated; border-radius: 6px; border: 2px solid var(--wood-2); }
dialog textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 2px solid var(--wood-2); border-radius: 6px; padding: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2a1c14; color: #fff4df; padding: 8px 14px; border-radius: 8px; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="logo">Pixie Closet</div>
    <div class="tag">character creator · pick a look, then hit the map</div>
  </header>

  <div class="main">
    <section class="win" aria-label="Character stage">
      <div class="title">Character <small id="statline">Lv. 1 · Beginner</small></div>
      <div class="pad">
        <div class="stage" id="stage">
          <canvas id="view" width="256" height="208"></canvas>
          <div class="mapname" id="mapname">Mushroom Meadow</div>
          <div class="viewlbl" id="viewlbl">Front</div>
          <div class="bubble" id="bubble" hidden></div>
          <div class="nametag"><div class="nm" id="nm">Pixie</div></div>
          <button class="turn l" id="turnL" aria-label="Turn left">◀</button>
          <button class="turn r" id="turnR" aria-label="Turn right">▶</button>
        </div>
        <div class="row">
          <div class="field"><label for="name">Name</label><input id="name" type="text" maxlength="14" value="Pixie"></div>
          <div class="field"><label for="map">Map</label><select id="map"></select></div>
        </div>
        <form class="row" id="chatform">
          <div class="field"><label for="chat">Say</label><input id="chat" type="text" maxlength="60" placeholder="Type, then Enter to show a chat bubble"></div>
          <button class="btn" type="submit">Say</button>
        </form>
        <div class="row">
          <button class="btn go" id="rand">🎲 Randomize</button>
          <button class="btn" id="undress">Undress</button>
          <button class="btn" id="snap">Snapshot</button>
          <button class="btn" id="share">Outfit code</button>
        </div>
        <div class="section-lbl">Job outfits</div>
        <div class="jobs" id="jobs"></div>
        <div class="section-lbl">Closet slots</div>
        <div class="slots" id="slots"></div>
      </div>
    </section>

    <section class="win" aria-label="Inventory">
      <div class="title">Inventory <small id="count"></small></div>
      <div class="pad">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="itemname" id="itemname">&nbsp;</div>
        <div class="grid" id="grid"></div>
        <div class="section-lbl" id="dyelbl">Dye</div>
        <div class="swatches" id="swatches"></div>
        <div class="hint">Tip: drag on the stage or use ◀ ▶ to turn. Keys: ← → turn, R randomize.</div>
      </div>
    </section>
  </div>
</div>

<dialog id="dlg">
  <div class="title" style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,var(--wood-2),var(--wood));color:#fff4df;font-family:var(--display);padding:6px 12px;letter-spacing:1.5px;text-transform:uppercase"><span id="dlgtitle">Snapshot</span><button class="btn" id="dlgclose" style="padding:0 8px">✕</button></div>
  <div class="pad" id="dlgbody"></div>
</dialog>
<div class="toast" id="toast" hidden></div>

// ---------- masks ----------

const SW = 256, SH = 208, GROUND = 184;

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function bands(g, cols, y0, y1) { // dithered vertical gradient
  const n = cols.length - 1;
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0) * n, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    for (let x = 0; x < SW; x += 2) {
      const dith = ((x >> 1) + y) % 2 === 0 ? 0.25 : -0.25;
      g.fillStyle = f + dith > 0.5 ? cols[i + 1] : cols[i];
      g.fillRect(x, y, 2, 1);
    }
  }
}
function cloud(g, x, y, s, c, sh) {
  g.fillStyle = sh; [[0, 4, 22, 6], [4, 0, 12, 6], [14, 2, 10, 6]].forEach(([a, b, w, h]) => g.fillRect(x + a * s, y + b * s + 2, w * s, h * s));
  g.fillStyle = c; [[0, 4, 22, 5], [4, 0, 12, 6], [14, 2, 10, 6]].forEach(([a, b, w, h]) => g.fillRect(x + a * s, y + b * s, w * s, h * s));
}
function hills(g, y, amp, per, c, phase = 0) {
  g.fillStyle = c;
  for (let x = 0; x < SW; x++) { const h = Math.round(y - amp * (Math.sin((x + phase) / per) * .6 + Math.sin((x + phase) / (per * .43)) * .4)); g.fillRect(x, h, 1, SH - h); }
}
function groundStrip(g, top, side, dark, pattern) {
  g.fillStyle = side; g.fillRect(0, GROUND, SW, SH - GROUND);
  g.fillStyle = dark; for (let x = 0; x < SW; x += 8) for (let y = GROUND + 8; y < SH; y += 8) if (pattern(x, y)) g.fillRect(x + ((y >> 3) % 2) * 4, y, 3, 2);
  g.fillStyle = top; g.fillRect(0, GROUND - 2, SW, 7);
  for (let x = 0; x < SW; x += 3) g.fillRect(x, GROUND - 3 - ((x * 7) % 3 === 0 ? 1 : 0), 2, 2);
  g.fillStyle = dark; g.fillRect(0, GROUND + 5, SW, 1);
}
function mushroomHouse(g, x, y, cap, s = 1) {
  g.fillStyle = '#f3e3c6'; g.fillRect(x - 7 * s, y - 14 * s, 14 * s, 14 * s);
  g.fillStyle = '#8a5a3c'; g.fillRect(x - 3 * s, y - 8 * s, 6 * s, 8 * s);
  g.fillStyle = '#6fb7e0'; g.fillRect(x + 3 * s, y - 12 * s, 3 * s, 3 * s);

  for (let r = 0; r < 12 * s; r++) { const w = Math.round(Math.sqrt(1 - Math.pow(1 - r / (12 * s), 2)) * 15 * s); g.fillRect(x - w, y - 14 * s - 12 * s + r, w * 2, 1); }

}
function star(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }

const PARTICLES = [];
function particles(kind, t, g) {
  const r = rng(7);
  const n = kind === 'leaf' ? 14 : kind === 'snow' ? 46 : kind === 'firefly' ? 18 : kind === 'petal' ? 18 : 0;
  for (let i = 0; i < n; i++) {
    const sp = .4 + r() * .6, x0 = r() * SW, ph = r() * 1000;
    if (kind === 'firefly') {
      const x = (x0 + Math.sin((t / 1400 + ph) * sp) * 18 + SW) % SW, y = 60 + r() * 110 + Math.cos((t / 1100 + ph)) * 10;
      const on = Math.sin(t / 400 + ph) > -.2; if (!on) continue;

      continue;

    const y = ((t / 40) * sp + ph) % (SH + 20) - 10, x = (x0 + Math.sin(y / 18 + ph) * 8 + (kind === 'snow' ? 0 : y * .3)) % SW;
    if (kind === 'snow') { g.fillStyle = '#ffffff'; g.fillRect(x | 0, y | 0, sp > .7 ? 2 : 1, sp > .7 ? 2 : 1); }

}

(function () {
  const $ = id => document.getElementById(id);
  const CATS = ['hair', 'top', 'bottom', 'dress', 'shoes', 'hat', 'face', 'back', 'hand'];
  const TABS = [
    { id: 'body', label: 'Body' }, { id: 'hair', label: 'Hair' }, { id: 'top', label: 'Tops' }, { id: 'bottom', label: 'Bottoms' },
    { id: 'dress', label: 'Outfits' }, { id: 'shoes', label: 'Shoes' }, { id: 'hat', label: 'Hats' }, { id: 'face', label: 'Face' },
    { id: 'back', label: 'Back' }, { id: 'hand', label: 'Weapons' },
  ];
  const DIRS = [{ v: 'front', flip: false, label: 'Front' }, { v: 'side', flip: true, label: 'Right' }, { v: 'back', flip: false, label: 'Back' }, { v: 'side', flip: false, label: 'Left' }];
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('pixie.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('pixie.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  const PRESETS = [
    { name: 'Beginner', s: { hair: ['messy', '#7a4a2e'], top: ['maple'], bottom: ['shorts', '#4d74b8'], shoes: ['sneakers'] } },
    { name: 'Warrior', s: { hair: ['spiky', '#c8364a'], top: ['armor'], bottom: ['joggers', '#5a5566'], shoes: ['knight'], hat: ['viking'], back: ['cape'], hand: ['sword'] } },
    { name: 'Magician', s: { hair: ['long', '#cbb4f0'], dress: ['witch'], shoes: ['mary'], hat: ['witchhat'], hand: ['staff'], face: ['roundglass', '#f2c14e'] } },
    { name: 'Bowman', s: { hair: ['pony', '#a35d36'], top: ['tunic'], bottom: ['cargo', '#7a6a4a'], shoes: ['boots'], back: ['quiver'], hand: ['huntbow'], hat: ['flowers', '#f7f3f8'] } },
    { name: 'Thief', s: { hair: ['wolf', '#2b2633'], top: ['hoodie', '#34303d'], bottom: ['joggers', '#2c3a6b'], shoes: ['boots', '#34303d'], face: ['ninja'], hand: ['dagger'], hat: ['bandana', '#7a4bc4'] } },
    { name: 'Pirate', s: { hair: ['hime', '#c8364a'], dress: ['pirate'], shoes: ['boots', '#34303d'], hat: ['tricorn'], hand: ['cutlass'], face: ['patch'] } },
    { name: 'Princess', s: { hair: ['curls', '#f0cf6e'], dress: ['gown'], shoes: ['mary', '#f7f3f8'], hat: ['crown'], hand: ['bouquet'] } },
    { name: 'Magical Girl', s: { hair: ['twintail', '#f49ac1'], dress: ['magical'], shoes: ['stockings', '#f7a8c4'], hat: ['bow', '#f7a8c4'], back: ['fairywings'], hand: ['wand'] } },
    { name: 'Cozy Day', s: { hair: ['buns', '#4a2e24'], top: ['sweater', '#f6e3b8'], bottom: ['maxi', '#8a5a3c'], shoes: ['bunnyslip'], hat: ['phones'], hand: ['plush'] } },
    { name: 'Mushroom Kid', s: { hair: ['puff', '#d8743a'], top: ['tee', '#f7f3f8'], bottom: ['overalls', '#e0475a'], shoes: ['rain'], hat: ['mushroom'], hand: ['leafshield'] } },
  ];

  let state = defaultState();
  let dir = 0, tab = 'hair', sceneIdx = 0, bubbleUntil = 0;
  function defaultState() { return fromPreset(PRESETS[0], { name: 'Pixie', skin: 0, eyes: 0, job: 'Beginner' }); }
  function fromPreset(p, base) {
    const equip = {};
    for (const [cat, [id, color]] of Object.entries(p.s)) equip[cat] = { id, color: color || null };
    return { name: base.name, skin: base.skin, eyes: base.eyes, job: p.name, equip };
  }

  // ---------- character rendering with cache ----------
  const charCanvas = document.createElement('canvas'); charCanvas.width = CW; charCanvas.height = CH;
  const cctx = charCanvas.getContext('2d');
  let cacheKey = '';
  function drawChar(view, blink) {
    const key = JSON.stringify(state.equip) + state.skin + state.eyes + view + blink;
    if (key === cacheKey) return;
    cacheKey = key;
    const buf = renderCharacter(view, state, { blink });
    cctx.putImageData(new ImageData(buf, CW, CH), 0, 0);
  }

  // ---------- stage ----------
  const view = $('view'), g = view.getContext('2d');
  g.imageSmoothingEnabled = false;
  let blinkAt = performance.now() + 2500, blinkOn = false;
  function frame(t) {
    if (t > blinkAt) { blinkOn = true; if (t > blinkAt + 140) { blinkOn = false; blinkAt = t + 2200 + Math.random() * 2800; } }
    const d = DIRS[dir];
    SCENES[sceneIdx].draw(g, t);
    // shadow
    g.fillStyle = 'rgba(40,20,30,.22)';
    for (let y = 0; y < 4; y++) { const w = 26 - Math.abs(y - 1.5) * 4; g.fillRect(128 - w, GROUND - 2 + y, w * 2, 1); }
    drawChar(d.v, blinkOn && d.v !== 'back');
    const bob = Math.floor(t / 520) % 2;
    g.save();
    if (d.flip) { g.translate(SW, 0); g.scale(-1, 1); }
    g.drawImage(charCanvas, 64, GROUND - FEET_Y + bob);
    g.restore();
    if (bubbleUntil && t > bubbleUntil) { $('bubble').hidden = true; bubbleUntil = 0; }
    requestAnimationFrame(frame);
  }

  function turn(step) { dir = (dir + step + DIRS.length) % DIRS.length; $('viewlbl').textContent = DIRS[dir].label; }
  $('turnL').onclick = () => turn(-1);
  $('turnR').onclick = () => turn(1);
  let dragX = null;
  $('stage').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; dragX = e.clientX; });
  window.addEventListener('pointermove', e => { if (dragX === null) return; const dx = e.clientX - dragX; if (Math.abs(dx) > 36) { turn(dx > 0 ? -1 : 1); dragX = e.clientX; } });
  window.addEventListener('pointerup', () => { dragX = null; });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, select')) return;
    if (e.key === 'ArrowLeft') turn(-1); else if (e.key === 'ArrowRight') turn(1);
    else if (e.key === 'r' || e.key === 'R') randomize();
  });

  // ---------- header fields ----------
  SCENES.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.name; $('map').appendChild(o); });
  $('map').onchange = () => { sceneIdx = +$('map').value; $('mapname').textContent = SCENES[sceneIdx].name; save(); };
  $('name').oninput = () => { state.name = $('name').value.trim() || 'Pixie'; refreshTags(); save(); };
  $('chatform').addEventListener('submit', e => {
    e.preventDefault(); const msg = $('chat').value.trim(); if (!msg) return;
    const b = $('bubble'); b.textContent = msg; b.hidden = false; bubbleUntil = performance.now() + 5000; $('chat').value = '';
  });
  function refreshTags() {
    $('nm').textContent = state.name;
    const n = Object.values(state.equip).filter(Boolean).length;
    $('statline').textContent = `Lv. ${8 + n * 9} · ${state.job || 'Adventurer'}`;
  }

  // ---------- thumbnails ----------
  function thumb(canvas, buf, crop) {
    let [x0, y0, x1, y1] = crop || bbox(buf);
    const w = x1 - x0 + 1, h = y1 - y0 + 1, S = canvas.width - 6;
    let s = Math.min(S / w, S / h); if (s >= 1) s = Math.floor(s);
    const t = document.createElement('canvas'); t.width = CW; t.height = CH; t.getContext('2d').putImageData(new ImageData(buf, CW, CH), 0, 0);
    const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height);
    c.imageSmoothingEnabled = s < 1;
    c.drawImage(t, x0, y0, w, h, Math.round((canvas.width - w * s) / 2), Math.round((canvas.height - h * s) / 2), w * s, h * s);
  }
  function bbox(buf) {
    let x0 = CW, y0 = CH, x1 = 0, y1 = 0;
    for (let i = 3; i < buf.length; i += 4) if (buf[i]) { const p = (i - 3) / 4, x = p % CW, y = p / CW | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return x0 > x1 ? [0, 0, CW - 1, CH - 1] : [x0, y0, x1, y1];
  }
  const OY = FEET_Y - VIEWS.front.h, OX = 64 - VIEWS.front.cx;
  const HEAD_CROP = [OX - 22, OY - 40, OX + 102, OY + 84];

  // ---------- inventory ----------
  TABS.forEach(t => {
    const b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = t.label; b.dataset.tab = t.id;
    b.onclick = () => { tab = t.id; buildGrid(); }; $('tabs').appendChild(b);
  });
  $('count').textContent = `${ITEMS.length} items · ${TABS.length - 1} slots`;
  function cell(label, pressed, onclick) {
    const b = document.createElement('button'); b.className = 'cell'; b.setAttribute('aria-pressed', pressed); b.title = label; b.setAttribute('aria-label', label);
    b.onclick = onclick; $('grid').appendChild(b); return b;
  }
  function buildGrid() {
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    const grid = $('grid'); grid.innerHTML = '';
    if (tab === 'body') {
      SKIN_TONES.forEach((s, i) => {
        const b = cell(s.name, state.skin === i, () => { state.skin = i; changed(); });
        const c = document.createElement('canvas'); c.width = c.height = 64; b.appendChild(c);
        thumb(c, renderCharacter('front', { skin: i, eyes: state.eyes, equip: {} }), [OX, OY, OX + 80, OY + 127]);
      });
      buildSwatches(); showName(); return;
    }
    const cur = state.equip[tab];
    const none = cell('None', !cur, () => { delete state.equip[tab]; changed(); });
    none.innerHTML = '<span class="x">none</span>';
    ITEMS.filter(i => i.cat === tab).forEach(it => {
      const sel = cur && cur.id === it.id;
      const b = cell(it.name, !!sel, () => equip(it));
      const c = document.createElement('canvas'); c.width = c.height = 64; b.appendChild(c);
      const color = sel && cur.color ? cur.color : (tab === 'hair' ? (cur && cur.color) || '#7a4a2e' : it.dye);
      const withBody = tab === 'hair' || tab === 'hat' || tab === 'face';
      const buf = renderCharacter('front', { skin: state.skin, eyes: state.eyes, equip: {} }, { only: { id: it.id, color }, withBody });
      thumb(c, buf, withBody ? (tab === 'face' ? [OX + 4, OY + 28, OX + 76, OY + 70] : HEAD_CROP) : null);
    });
    buildSwatches(); showName();
  }
  function showName() {
    const n = $('itemname');
    if (tab === 'body') { n.innerHTML = `${SKIN_TONES[state.skin].name} <span>skin · ${EYE_COLORS[state.eyes].name} eyes</span>`; return; }
    const cur = state.equip[tab];
    n.innerHTML = cur ? `${ITEM_BY_ID[cur.id].name} <span>equipped</span>` : `<span>Nothing equipped in this slot</span>`;
  }
  function buildSwatches() {
    const box = $('swatches'); box.innerHTML = '';
    if (tab === 'body') {
      $('dyelbl').textContent = 'Eye color';
      EYE_COLORS.forEach((e, i) => {
        const b = document.createElement('button'); b.className = 'sw big'; b.setAttribute('aria-pressed', state.eyes === i);
        b.innerHTML = `<i style="background:${e.c[1]}"></i>${e.name}`; b.onclick = () => { state.eyes = i; changed(); }; box.appendChild(b);
      });
      return;
    }
    const cur = state.equip[tab];
    $('dyelbl').textContent = tab === 'hair' ? 'Hair color' : 'Dye';
    if (!cur) { box.innerHTML = '<span class="hint">Equip an item to dye it.</span>'; return; }
    const it = ITEM_BY_ID[cur.id], now = (cur.color || it.dye || '').toLowerCase();
    (tab === 'hair' ? HAIR_COLORS : DYES).forEach(hex => {
      const b = document.createElement('button'); b.className = 'sw'; b.style.background = hex; b.title = hex; b.setAttribute('aria-label', 'Dye ' + hex);
      b.setAttribute('aria-pressed', now === hex.toLowerCase()); b.onclick = () => { cur.color = hex; changed(); }; box.appendChild(b);
    });
    const pick = document.createElement('input'); pick.type = 'color'; pick.id = 'custom-dye'; pick.value = /^#[0-9a-f]{6}$/i.test(now) ? now : '#999999'; pick.title = 'Custom color';
    pick.oninput = () => { cur.color = pick.value; cacheKey = ''; save(); };
    pick.onchange = () => { cur.color = pick.value; changed(); };
    box.appendChild(pick);
    if (it.dye && tab !== 'hair') {
      const r = document.createElement('button'); r.className = 'btn'; r.textContent = 'Original'; r.style.padding = '2px 8px'; r.style.fontSize = '12px';
      r.onclick = () => { cur.color = null; changed(); }; box.appendChild(r);
    }
  }
  function equip(it) {
    const prev = state.equip[it.cat];
    state.equip[it.cat] = { id: it.id, color: it.cat === 'hair' ? (prev && prev.color) || '#7a4a2e' : null };
    if (it.cat === 'dress') { delete state.equip.top; delete state.equip.bottom; }
    if (it.cat === 'top' || it.cat === 'bottom') delete state.equip.dress;
    changed();
  }
  function changed() { cacheKey = ''; refreshTags(); buildGrid(); save(); }

  // ---------- presets / random ----------
  PRESETS.forEach(p => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = p.name;
    b.onclick = () => { state = fromPreset(p, state); changed(); toast(`${p.name} outfit equipped`); };
    $('jobs').appendChild(b);
  });
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function randomize() {
    const eq = {}, by = c => ITEMS.filter(i => i.cat === c);
    eq.hair = { id: pick(by('hair')).id, color: pick(HAIR_COLORS) };
    if (Math.random() < .35) eq.dress = { id: pick(by('dress')).id, color: Math.random() < .5 ? pick(DYES) : null };
    else { eq.top = { id: pick(by('top')).id, color: pick(DYES) }; eq.bottom = { id: pick(by('bottom')).id, color: pick(DYES) }; }
    eq.shoes = { id: pick(by('shoes')).id, color: Math.random() < .5 ? pick(DYES) : null };
    for (const [c, p] of [['hat', .55], ['face', .3], ['back', .3], ['hand', .5]]) if (Math.random() < p) eq[c] = { id: pick(by(c)).id, color: Math.random() < .4 ? pick(DYES) : null };
    state.equip = eq; state.skin = Math.floor(Math.random() * 6); state.eyes = Math.floor(Math.random() * EYE_COLORS.length);
    state.job = pick(['Adventurer', 'Wanderer', 'Fashionista', 'Explorer', 'Dreamer']);
    changed();
  }
  $('rand').onclick = randomize;
  $('undress').onclick = () => { state.equip = {}; state.job = 'Beginner'; changed(); };

  // ---------- closet slots ----------
  function buildSlots() {
    const box = $('slots'); box.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const data = store.get('slot' + i);
      const d = document.createElement('div'); d.className = 'slot';
      const c = document.createElement('canvas'); c.width = 96; c.height = 132; d.appendChild(c);
      if (data) thumb(c, renderCharacter('front', data), [OX - 6, OY - 30, OX + 86, OY + 128]);
      else { const x = c.getContext('2d'); x.fillStyle = '#c9a985'; x.font = '600 14px "Pixelify Sans", sans-serif'; x.textAlign = 'center'; x.fillText('empty', 48, 70); }
      const r = document.createElement('div'); r.className = 'row';
      const sv = document.createElement('button'); sv.className = 'btn'; sv.textContent = 'Save';
      sv.onclick = () => { store.set('slot' + i, state); buildSlots(); toast(`Saved to slot ${i + 1}`); };
      const ld = document.createElement('button'); ld.className = 'btn'; ld.textContent = 'Wear'; ld.disabled = !data;
      ld.onclick = () => { state = JSON.parse(JSON.stringify(data)); $('name').value = state.name; changed(); toast(`Wearing slot ${i + 1}`); };
      r.append(sv, ld); d.appendChild(r); box.appendChild(d);
    }
  }

  // ---------- snapshot + share ----------
  function dialog(title, nodes) {
    $('dlgtitle').textContent = title; const body = $('dlgbody'); body.innerHTML = ''; nodes.forEach(n => body.appendChild(n));
    const d = $('dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  $('dlgclose').onclick = () => { const d = $('dlg'); d.close ? d.close() : d.removeAttribute('open'); };
  $('snap').onclick = () => {
    const S = 3, c = document.createElement('canvas'); c.width = SW * S; c.height = SH * S;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(view, 0, 0, c.width, c.height);
    x.font = `600 ${11 * S}px "Pixelify Sans", sans-serif`; x.textAlign = 'center';
    const w = x.measureText(state.name).width + 14 * S; x.fillStyle = 'rgba(20,16,30,.8)'; x.fillRect(SW * S / 2 - w / 2, 187 * S, w, 14 * S);
    x.fillStyle = '#fff'; x.fillText(state.name, SW * S / 2, 198 * S);
    const img = document.createElement('img'); img.alt = `${state.name} snapshot`;
    img.src = c.toDataURL('image/png');
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'Right-click or long-press the picture to save it.';
    dialog('Snapshot', [img, p]);
  };
  function encode(s) { return btoa(unescape(encodeURIComponent(JSON.stringify({ n: s.name, k: s.skin, e: s.eyes, j: s.job, q: Object.fromEntries(Object.entries(s.equip).map(([c, v]) => [c, [v.id, v.color]])) })))); }
  function decode(code) {
    const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    const equip = {}; for (const [c, [id, color]] of Object.entries(o.q || {})) if (ITEM_BY_ID[id] && CATS.includes(c)) equip[c] = { id, color: color || null };
    return { name: String(o.n || 'Pixie').slice(0, 14), skin: +o.k % SKIN_TONES.length || 0, eyes: +o.e % EYE_COLORS.length || 0, job: String(o.j || 'Adventurer').slice(0, 20), equip };
  }
  $('share').onclick = () => {
    const ta = document.createElement('textarea'); ta.id = 'codebox'; ta.value = encode(state); ta.setAttribute('aria-label', 'Outfit code');
    const r = document.createElement('div'); r.className = 'row';
    const cp = document.createElement('button'); cp.className = 'btn go'; cp.textContent = 'Copy code';
    cp.onclick = () => { navigator.clipboard.writeText(ta.value).then(() => toast('Code copied'), () => { ta.select(); toast('Press Ctrl+C to copy'); }); };
    const ld = document.createElement('button'); ld.className = 'btn'; ld.textContent = 'Wear pasted code';
    ld.onclick = () => { try { state = decode(ta.value); $('name').value = state.name; changed(); $('dlgclose').click(); toast('Outfit loaded'); } catch (e) { toast('That code could not be read. Paste the full code and try again.'); } };
    r.append(cp, ld);
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'Share this code with a friend, or paste theirs here and press Wear.';
    dialog('Outfit code', [ta, r, p]);
  };
  let toastT; function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

  function save() { store.set('cur', { state, sceneIdx }); }

  // ---------- boot ----------
  function start(data) {
    const saved = (data && data.state) ? data : store.get('cur');
    if (saved && saved.state && saved.state.equip) { state = saved.state; sceneIdx = saved.sceneIdx || 0; }
    for (const c of Object.keys(state.equip)) if (!ITEM_BY_ID[state.equip[c]?.id]) delete state.equip[c];
    if (data && data.tab) tab = data.tab; if (data && data.dir) dir = data.dir;
    $('name').value = state.name; $('map').value = sceneIdx; $('mapname').textContent = SCENES[sceneIdx].name; $('viewlbl').textContent = DIRS[dir].label;
    refreshTags(); buildGrid(); buildSlots();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ state, sceneIdx, tab, dir }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
